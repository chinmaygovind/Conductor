<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Conductor{% endblock %}</title>
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#1a1210"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Conductor"/>
  <link rel="apple-touch-icon" href="/static/images/icon.svg"/>
  <!-- Fonts & styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}"/>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  {% block scripts %}{% endblock %}
  <!-- The heartbeat behind the green dot on cgovind.com/accounts. Inline
       rather than a file of its own: it is a dozen lines, and a new file would
       have to join `sw.js`'s precache list to work offline, which is a lot of
       machinery for a ping. -->
  <script>
    (function () {
      var where = {{ (presence_where or 'home')|tojson }};
      function ping() {
        // A hidden tab is not somebody playing. Skipping it is most of what
        // makes the dot honest about a browser left open for three days.
        if (document.hidden || !{{ 'true' if presence_on else 'false' }}) return;
        try {
          fetch('/api/presence', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ where: where }), keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      }
      ping();
      setInterval(ping, 60000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) ping();
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
